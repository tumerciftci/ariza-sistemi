<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Arıza Listesi</h2>

    <a href="/ekle" class="btn btn-primary mb-3">Yeni Arıza</a>
    <a href="/logout" class="btn btn-danger mb-3">Çıkış</a>

    <table class="table table-bordered">
        <tr>
            <th>ID</th>
            <th>Cihaz</th>
            <th>Durum</th>
        </tr>

        {% for a in arizalar %}
        <tr>
            <td>{{a.id}}</td>
            <td>{{a.cihaz}}</td>
            <td>{{a.durum}}</td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
