<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height:100vh;">

<div class="card shadow p-4" style="width:300px;">
    <h3 class="text-center mb-3">Giriş Yap</h3>

    <form method="post">
        <input type="text" name="username" class="form-control mb-2" placeholder="Kullanıcı adı" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="Şifre" required>
        <button class="btn btn-primary w-100">Giriş</button>
    </form>
</div>

</body>
</html>
