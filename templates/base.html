<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Arıza Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6f9; }
        .sidebar {
            height:100vh;
            background:#343a40;
            color:white;
            padding:20px;
        }
        .sidebar a {
            color:white;
            display:block;
            margin:10px 0;
            text-decoration:none;
        }
        .sidebar a:hover {
            background:#495057;
            padding:5px;
            border-radius:5px;
        }
    </style>
</head>

<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-2 sidebar">
            <h4>⚙️ Panel</h4>
            <a href="/dashboard">Dashboard</a>
            <a href="/ekle">Yeni Arıza</a>
            <a href="/pdf">Rapor</a>
            <a href="/logout">Çıkış</a>
        </div>

        <!-- İçerik -->
        <div class="col-10 p-4">
            {% block content %}{% endblock %}
        </div>

    </div>
</div>
</body>
</html>
